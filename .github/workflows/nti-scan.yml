name: NTI-1 Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by design. The scan reports into the job log only and never
# modifies the repository, so this workflow keeps `contents: read` and
# satisfies the LFDT / OpenSSF Token-Permissions and Dangerous-Workflow
# requirements.
#
# The badge shown in README.md is the live workflow-status badge
# (shields.io reads the Actions status API), not a badge committed back to the
# tree. A committed badge would need `contents: write`, and it would also
# render a score for a repository that contains only documentation. This repo
# has no agent code, so the action correctly reports `n/a` rather than 100/100.
permissions:
  contents: read
jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: abisheakp197/nti-scan-action@143907be8a716cbf0fd83731f89d58ccea825a74 # v1.1.0
        with:
          mode: report
          min-score: '0'
