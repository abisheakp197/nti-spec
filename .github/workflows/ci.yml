name: NTI Spec CI Audit

on:
  push:
    branches: [main, "crucible/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-validate:
    name: Markdown Lint, Link Checker & Conformance Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Markdown Linter
        run: npm install -g markdownlint-cli

      - name: Run Markdown Linter
        run: markdownlint "*.md" "**/*.md"

      - name: Run Link Checker
        run: python3 scripts/check_links.py

      - name: Run Conformance Validator & Code Block Execution
        run: python3 conformance/validate.py
