name: NTI Spec CI Audit

on:
  push:
    branches: [main, "crucible/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-validate:
    name: Markdown Lint, Link Checker & Conformance Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Markdown Linter
        run: npm install -g "markdownlint-cli@0.50.0"

      - name: Run Markdown Linter
        run: markdownlint "*.md" "**/*.md"

      - name: Install Python dependencies
        run: pip install "requests==2.32.3"

      - name: Run Link Checker
        run: python3 scripts/check_links.py

      - name: Run Conformance Validator & Code Block Execution
        run: python3 conformance/validate.py
