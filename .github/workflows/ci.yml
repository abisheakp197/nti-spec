name: NTI Spec CI Audit

on:
  push:
    branches: [main, "crucible/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-validate:
    name: Markdown Lint, Link Checker & Conformance Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Markdown Linter
        run: npm install -g "markdownlint-cli@0.50.0"

      - name: Run Markdown Linter
        run: markdownlint "*.md" "**/*.md"

      - name: Install Python dependencies
        run: pip install "requests==2.32.3"

      - name: Run Link Checker
        run: python3 scripts/check_links.py

      - name: Run Conformance Validator & Code Block Execution
        run: python3 conformance/validate.py
