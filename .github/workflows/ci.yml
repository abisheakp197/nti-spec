name: NTI Spec CI Audit

on:
  push:
    branches: [main, "crucible/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-and-validate:
    name: Markdown Lint, Link Checker & Conformance Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Markdown Linter
        run: npm ci

      - name: Run Markdown Linter
        run: npx --no-install markdownlint "*.md" "**/*.md"

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Run Link Checker
        run: python3 scripts/check_links.py

      - name: Run Conformance Validator & Code Block Execution
        run: python3 conformance/validate.py
