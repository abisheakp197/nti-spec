name: ASL Conformance

on:
  push:
    branches: [main, "crucible/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  asl-conformance:
    name: ASL Conformance Harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run LGD Transition Sidecar
        run: python conformance/transition_sidecar.py --selftest

  rust-regressions:
    name: Original baseline must reproduce both defects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate tests
        uses: actions/checkout@v4

      - name: Checkout pinned engine
        uses: actions/checkout@v4
        with:
          repository: abisheakp197/Neutral-Trust-Infrastructure
          ref: 308fd1c95f2c2f975e8b6b6c5e7ccba0e4d7b203
          path: .nti-engine
          persist-credentials: false

      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal

      - name: Verify pin and stage integration tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .nti-engine rev-parse HEAD)" = "308fd1c95f2c2f975e8b6b6c5e7ccba0e4d7b203"
          cp conformance/rust/nti_regressions.rs .nti-engine/ube-foundation/tests/nti_conformance_regressions.rs

      - name: Run Rust regression cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust-regression-results
          rustc +1.90.0 -Vv > rust-regression-results/toolchain.txt
          cargo +1.90.0 --version >> rust-regression-results/toolchain.txt
          sha256sum .nti-engine/ube-foundation/Cargo.lock conformance/rust/nti_regressions.rs > rust-regression-results/SHA256SUMS.txt
          set +e
          cargo +1.90.0 test --locked --manifest-path .nti-engine/ube-foundation/Cargo.toml --test nti_conformance_regressions -- --nocapture 2>&1 | tee rust-regression-results/cargo.log
          cargo_status=${PIPESTATUS[0]}
          set -e
          test "$cargo_status" = 101
          python - <<'PY'
          from pathlib import Path
          log = Path("rust-regression-results/cargo.log").read_text()
          assert "test result: FAILED. 0 passed; 2 failed;" in log
          for case in ("unsigned_capability_cannot_grant_authority", "required_quorum_blocks_dispatch_when_one_module_is_available"):
              assert f"test {case} ... FAILED" in log
          print("Pinned vulnerable baseline reproduced both expected assertion failures.")
          PY

      - name: Retain execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-rust-regression-results
          path: rust-regression-results/
          if-no-files-found: warn

  rust-patched-engine:
    name: Candidate core fix and regression controls
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: abisheakp197/Neutral-Trust-Infrastructure
          ref: 308fd1c95f2c2f975e8b6b6c5e7ccba0e4d7b203
          path: .nti-patched
          persist-credentials: false
      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt
      - name: Verify baseline and apply candidate patch
        run: |
          set -euo pipefail
          test "$(git -C .nti-patched rev-parse HEAD)" = "308fd1c95f2c2f975e8b6b6c5e7ccba0e4d7b203"
          git -C .nti-patched apply --check "$GITHUB_WORKSPACE/conformance/rust/patches/issuer-and-quorum.patch"
          git -C .nti-patched apply "$GITHUB_WORKSPACE/conformance/rust/patches/issuer-and-quorum.patch"
          cmp conformance/rust/nti_regressions.rs .nti-patched/ube-foundation/tests/nti_conformance_regressions.rs
      - name: Compile and run core tests and regression controls
        run: |
          set -euo pipefail
          mkdir -p patched-rust-results
          rustc +1.90.0 -Vv > patched-rust-results/toolchain.txt
          sha256sum conformance/rust/patches/issuer-and-quorum.patch .nti-patched/ube-foundation/Cargo.lock > patched-rust-results/SHA256SUMS.txt
          cargo +1.90.0 test --locked --manifest-path .nti-patched/ube-foundation/Cargo.toml --lib --test core_tests --test nti_conformance_regressions --test security_patch_tests -- --nocapture 2>&1 | tee patched-rust-results/cargo.log
          cargo +1.90.0 check --locked --manifest-path .nti-patched/ube-foundation/Cargo.toml --features python 2>&1 | tee patched-rust-results/python-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-core-fix-results
          path: patched-rust-results/
